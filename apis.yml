aid: amazon-aurora-dsql
name: Amazon Aurora DSQL
description: >-
  Amazon Aurora DSQL is a distributed SQL database service optimized for transactional workloads. It provides a
  serverless, fully managed PostgreSQL-compatible database with built-in high availability, scalability, and global
  distribution capabilities.
